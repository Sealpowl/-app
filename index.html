<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="专注">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>专注记录</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--tx:#4A4458;--sub:#9A93A6;--ac:#9DBFA5;--soft:#F3F1F6;--ln:#F0EEF3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#fff;color:var(--tx);font-weight:400;font-family:"Nunito",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
b{font-weight:600}
#hd{position:sticky;top:0;z-index:5;background:#fff;display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 12px 6px}
.ttl{font-size:17px;font-weight:600}
#main{padding:4px 20px 110px;max-width:560px;margin:0 auto}
.card{padding:18px 0;border-bottom:1px solid var(--ln)}.card:last-child{border:0}
h2{font-size:14px;margin:0 0 10px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:2px 16px;margin-bottom:10px}
input{font:inherit;font-size:15px;border:0;border-bottom:1px solid #E6E3EA;background:none;border-radius:0;padding:8px 2px;color:var(--tx);min-width:0}input:focus{outline:0;border-color:var(--ac)}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:999px;padding:9px 16px;background:var(--soft);color:var(--ac)}
.ghost{border:0;background:none;color:var(--sub);font-size:13px;padding:4px}
.lk{font-size:15px;color:var(--ac)}
.ib{border:0;background:none;padding:6px;font-size:30px;line-height:1;color:var(--sub);display:flex;align-items:center}
.bar{height:6px;border-radius:6px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.sub{color:var(--sub);font-size:13px}.big{font-size:20px;font-weight:600;margin:6px 0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.slot+.slot{margin-top:20px}.slot .bar{height:4px;margin-top:8px}.nm{font-size:14px;font-weight:600}.v{font-size:15px;font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;padding:6px 0;color:var(--sub);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
nav i{width:12px;height:12px;border-radius:50%;background:var(--c);opacity:.35}
nav button.on{color:var(--tx)}nav button.on i{opacity:1}
.bd{position:fixed;inset:0;background:rgba(74,68,88,.25);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:#fff;border-radius:22px 22px 0 0;padding:20px 20px calc(18px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.sheet.up{animation:up .2s ease-out}@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.hm{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:5px}
.hm>*{aspect-ratio:1;border-radius:6px;min-width:0}
.cell{background:var(--soft);border:0;padding:0;width:100%}
.hl{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-top:8px;font-size:13px;color:var(--sub)}.hl span{white-space:nowrap}
#ov{position:fixed;inset:0;z-index:20;background:#fff;overflow:auto;padding-top:env(safe-area-inset-top)}
#ov[hidden]{display:none}#ov.anim{animation:slin .22s ease-out}
@keyframes slin{from{transform:translateX(100%)}to{transform:none}}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px}
.pc{padding:0 20px 40px;max-width:560px;margin:0 auto}
.stats{display:flex;justify-content:space-between;margin:8px 4px 20px}.stats .n{font-size:22px;font-weight:600}
.tg{border:0;background:none;display:inline-flex;align-items:center;gap:6px;padding:6px 0;font-size:14px;color:var(--sub)}
.tg i{width:10px;height:10px;border-radius:50%;background:var(--c);opacity:.35}
.tg.on{color:var(--tx)}.tg.on i{opacity:1}
.tx{border:0;background:none;position:relative;padding:6px 0 11px;font-size:14px;color:var(--sub)}
.tx.on{color:var(--tx)}.tx.on::after{content:"";position:absolute;left:50%;bottom:3px;width:14px;margin-left:-7px;height:2px;border-radius:2px;background:var(--c,var(--ac))}
.pl{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ac);background:#fff;color:var(--ac);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.pl.sm{width:26px;height:26px}
.pl.fl{position:fixed;right:20px;bottom:calc(78px + env(safe-area-inset-bottom));width:44px;height:44px;z-index:10}
[data-k]{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#dg[hidden]{display:none}
</style></head><body><header id="hd"></header><div id="main"></div><nav></nav><div id="ov" hidden></div><div id="dg" hidden></div>
<script>
const $=s=>document.querySelector(s);
const SL=[['am','上午','#E8B4A0'],['pm','下午','#E2C275'],['ev','晚上','#8E9AC8']];
const PAL=['#9DB4A0','#E8A598','#E2C275','#8FB8C9','#D9A3B0','#A7B57A','#B7A3C9','#8E9AC8'];
let S=JSON.parse(localStorage.getItem('focus')||'null')||{items:[{id:1,name:'画画',color:'#E8A598'},{id:2,name:'运动',color:'#9DB4A0'}],logs:[],plans:[],goals:{am:30,pm:30,ev:30},nid:3};
const save=()=>localStorage.setItem('focus',JSON.stringify(S));
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-');return new Date(a,b-1,c)};
const fmt=m=>{const h=Math.floor(m/60),r=m%60;return h==0?r+'min':r==0?h+'h':h+'h'+r+'min'};
const sh=m=>m<60?m+'min':+(m/60).toFixed(1)+'h';
const item=id=>id==0?{name:'全部',color:'#C9C4D2'}:S.items.find(i=>i.id==id)||{name:'已删除',color:'#ccc'};
const sum=a=>a.reduce((x,l)=>x+l.min,0);
const hexA=(h,a)=>`rgba(${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)},${a})`;
const mon=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const curSlot=()=>{const h=new Date().getHours();return h<12?'am':h<18?'pm':'ev'};
let tab='rec',rd=dk(new Date()),rs=curSlot(),ri=0,sv='day',cm=new Date(),cf=0,cs=null,co=0,ov=null,sheet=0,sa=0,dr={};cm.setDate(1);
const NAV=[['cal','日历','#9DB4A0'],['rec','记录','#E8A598'],['stat','统计','#8FB8C9'],['plan','计划','#E2C275']];
const MENU='<svg width="24" height="24" viewBox="0 0 24 24"><path d="M4 8h16M4 15h10" stroke="#9A93A6" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>';
const GEAR='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9A93A6" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z"/><circle cx="12" cy="12" r="3"/></svg>';
function go(t){tab=t;sheet=0;render()}
function render(){
 $('#hd').innerHTML=`<button class=ib onclick="openOv('menu')">${MENU}</button><b class=ttl>${NAV.find(n=>n[0]==tab)[1]}</b>`;
 $('nav').innerHTML=NAV.map(n=>`<button class="${n[0]==tab?'on':''}" onclick="go('${n[0]}')"><i style="--c:${n[2]}"></i>${n[1]}</button>`).join('');
 $('#main').innerHTML={cal,rec,stat,plan}[tab]();
 if(ov)drawOv();
}
/* ---------- 菜单 / 设置（全屏，右划返回） ---------- */
function openOv(v,a){ov=v;const o=$('#ov');o.hidden=!v;o.className=a===0?'':'anim';if(v){o.scrollTop=0;drawOv()}}
function drawOv(){$('#ov').innerHTML=ov=='menu'?menuPg():setPg()}
function menuPg(){
 const days=new Set(S.logs.map(l=>l.date)).size;
 return `<div class=ph><button class=ib onclick="openOv(null,0)">‹</button><span class=sp></span><button class=ib onclick="openOv('set')">${GEAR}</button></div><div class=pc>
 <div class=stats><div><div class=n>${fmt(sum(S.logs))}</div><div class=sub>累计专注</div></div><div><div class=n>${S.items.filter(i=>!i.arch).length}</div><div class=sub>专注项</div></div><div><div class=n>${days}</div><div class=sub>记录天数</div></div></div>
 <div class=card><div class=row><h2 style="margin:0">专注项</h2><span class=sp></span><button class="pl sm" onclick="newItem()">${PLUS}</button></div>${S.items.map(i=>`<div class=row data-k=item data-id=${i.id} style="padding:8px 0;opacity:${i.arch?0.5:1}"><span class=dot style="background:${i.color};width:18px;height:18px" onclick="event.stopPropagation();recolor(${i.id})"></span>${i.name}<span class=sp></span><button class=ghost onclick="event.stopPropagation();arch(${i.id})">${i.arch?'恢复':'归档'}</button></div>`).join('')}<div class=sub style="margin-top:14px">点圆点换颜色，双击改名，长按删除</div></div></div>`}
function setPg(){return `<div class=ph><button class=ib onclick="openOv('menu',0)">‹</button><b class=ttl>设置</b></div><div class=pc><div class=sub style="margin:6px 0 16px">数据只存在这台设备的浏览器里，建议定期导出</div><div class=row style="gap:28px"><button class="ghost lk" onclick="exp()">导出</button><button class="ghost lk" onclick="$('#fi').click()">导入</button></div><input id=fi type=file accept=".json" hidden onchange="imp(this.files[0])"></div>`}
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(!ov)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(dx>70&&Math.abs(dy)<dx*.6)openOv(ov=='set'?'menu':null,0)},{passive:true});
/* ---------- 记录 ---------- */
function rec(){
 const act=S.items.filter(i=>!i.arch);
 if(!act.some(i=>i.id==ri))ri=act[0]?act[0].id:0;
 const L=S.logs.filter(l=>l.date==rd);
 return `${rd!=dk(new Date())?`<div class=row style="padding:6px 0"><span class=sub>正在记录 ${rd}</span><span class=sp></span><button class=ghost onclick="rd=dk(new Date());render()">回到今天</button></div>`:''}
 <div class=card>
 <div class=chips>${SL.map(s=>`<button class="tx ${rs==s[0]?'on':''}" style="--c:${s[2]}" onclick="rs='${s[0]}';render()">${s[1]}</button>`).join('')}</div>
 <div class=chips>${act.map(i=>`<button class="tg ${ri==i.id?'on':''}" style="--c:${i.color}" onclick="ri=${i.id};render()"><i></i>${i.name}</button>`).join('')}<button class="pl sm" onclick="newItem(id=>{ri=id})">${PLUS}</button></div>
 <div class=row style="margin-top:6px"><input id=mi type=number inputmode=numeric min=1 placeholder="填分钟数" style="flex:1"><button class=pl onclick="add(+$('#mi').value)">${PLUS}</button></div></div>
 <div class=card>${SL.map(s=>{const l=L.filter(x=>x.slot==s[0]),t=sum(l),g=S.goals[s[0]];return `<div class=slot><div class=row><span class=dot style="background:${s[2]}"></span><span class=nm>${s[1]}</span><span class=sp></span><span class=v>${fmt(t)}</span><button class=ghost onclick="goal('${s[0]}')">/ ${fmt(g)}</button></div><div class=bar><i style="width:${Math.min(100,t/g*100)}%;background:${s[2]}"></i></div>${l.map(x=>`<div class=row data-k=log data-id=${x.id} style="padding:8px 0 0;font-size:13px"><span class=dot style="background:${item(x.item).color};width:8px;height:8px"></span>${item(x.item).name}<span class=sp></span><span class=sub>${fmt(x.min)}</span></div>`).join('')}</div>`}).join('')}${L.length?'<div class=sub style="margin-top:16px;font-size:12px">双击记录修改，长按删除</div>':''}</div>`;
}
function add(m){if(!m||m<=0||!ri)return;S.logs.push({id:S.nid++,date:rd,slot:rs,item:ri,min:Math.round(m)});save();render()}
function del(id){S.logs=S.logs.filter(l=>l.id!=id);save();render()}
function recolor(id){const i=item(id),k=PAL.indexOf(i.color);i.color=PAL[(k+1)%PAL.length];save();render()}
function arch(id){const i=item(id);i.arch=!i.arch;save();render()}
/* ---------- 统计 ---------- */
function buckets(m){const n=new Date(),a=[],f=d=>(d.getMonth()+1)+'/'+d.getDate();
 if(m=='day')for(let i=13;i>=0;i--){const d=new Date(n);d.setDate(d.getDate()-i);a.push({k:dk(d),l:f(d)})}
 else if(m=='week')for(let i=7;i>=0;i--){const d=mon(n);d.setDate(d.getDate()-i*7);a.push({k:dk(d),l:f(d)})}
 else for(let i=m=='month'?11:5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);a.push({k:d.getFullYear()+'-'+pad(d.getMonth()+1),l:(d.getMonth()+1)+'月'})}
 return a}
function stat(){
 const m=sv,slot=m=='slot',bs=buckets(m);
 const key=l=>m=='day'?l.date:m=='week'?dk(mon(pd(l.date))):l.date.slice(0,7);
 const seg=slot?SL.map(s=>({id:s[0],n:s[1],c:s[2]})):S.items.map(i=>({id:i.id,n:i.name,c:i.color}));
 const sid=l=>slot?l.slot:l.item;
 const G=bs.map(b=>({l:b.l,s:seg.map(g=>sum(S.logs.filter(l=>key(l)==b.k&&sid(l)==g.id)))}));
 const tot=seg.map((g,i)=>({...g,v:G.reduce((a,b)=>a+b.s[i],0)})),all=tot.reduce((a,x)=>a+x.v,0);
 const n=G.length,W=340,H=150,bw=W/n,mx=Math.max(1,...G.map(b=>b.s.reduce((a,x)=>a+x,0)));
 let svg=`<svg viewBox="0 0 ${W} ${H+24}" width="100%">`;
 G.forEach((b,i)=>{let y=H;const x=i*bw+bw*.2,w=bw*.6,t=b.s.reduce((a,v)=>a+v,0);
  b.s.forEach((v,j)=>{if(!v)return;const h=v/mx*(H-16);y-=h;svg+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${seg[j].c}"/>`});
  if(t)svg+=`<text x="${x+w/2}" y="${y-4}" font-size="8" text-anchor="middle" fill="#9A93A6">${sh(t)}</text>`;
  svg+=`<text x="${x+w/2}" y="${H+14}" font-size="8" text-anchor="middle" fill="#9A93A6">${b.l}</text>`});
 svg+='</svg>';
 const T=[['day','按天'],['week','按周'],['month','按月'],['slot','按时段']];
 return `<div class=chips>${T.map(t=>`<button class="tx ${sv==t[0]?'on':''}" onclick="sv='${t[0]}';render()">${t[1]}</button>`).join('')}</div>
 <div class=card><div class=sub>${{day:'最近 14 天',week:'最近 8 周',month:'最近 12 个月',slot:'最近 6 个月 · 上午/下午/晚上'}[m]}合计</div><div class=big>${fmt(all)}</div>${svg}</div>
 <div class=card><h2>构成</h2>${tot.filter(t=>t.v).map(t=>`<div class=row style="margin-bottom:10px"><span class=dot style="background:${t.c}"></span>${t.n}<span class=sp></span><span class=sub>${fmt(t.v)}${slot?' · '+Math.round(t.v/all*100)+'%':''}</span></div>`).join('')||'<span class=sub>还没有记录，去「记录」页记一笔吧</span>'}</div>`;
}
/* ---------- 日历 ---------- */
function cal(){
 const WK=12,today=new Date(),td=dk(today);
 const st0=mon(today);st0.setDate(st0.getDate()-(WK-1)*7-co*WK*7);
 if(cf&&!S.items.some(i=>i.id==cf))cf=0;const lg=S.logs.filter(l=>!cf||l.item==cf),by={};
 lg.forEach(l=>{const o=by[l.date]=by[l.date]||{};o[l.item]=(o[l.item]||0)+l.min});
 const days=new Set(S.logs.map(l=>l.date));let c=0,d=new Date();if(!days.has(dk(d)))d.setDate(d.getDate()-1);
 while(days.has(dk(d))){c++;d.setDate(d.getDate()-1)}
 let cells='',labs=[];
 for(let w=0;w<WK;w++)for(let r=0;r<7;r++){
  const x=new Date(st0);x.setDate(x.getDate()+w*7+r);const k=dk(x);
  if(k>td){cells+='<div></div>';continue}
  if(x.getDate()==1)labs.push({w,m:x.getMonth()+1});
  const o=by[k];let s='';
  if(o){const e=Object.entries(o),t=e.reduce((a,v)=>a+v[1],0),dom=e.sort((a,b)=>b[1]-a[1])[0][0];s=`background:${hexA(item(dom).color,.3+.7*Math.min(t/120,1))};`}
  if(k==td)s+='box-shadow:inset 0 0 0 2px #9DBFA5;';
  if(k==cs)s+='box-shadow:inset 0 0 0 2px #4A4458;';
  cells+=`<button class=cell style="${s}" onclick="cs='${k}';render()"></button>`}
 if(!labs.length||labs[0].w>=3)labs.unshift({w:0,m:st0.getMonth()+1});
 const lb=labs.map((a,i)=>{const nx=labs[i+1]?labs[i+1].w:WK;return `<span style="grid-column:${a.w+1}/span ${Math.max(1,Math.min(3,nx-a.w))}">${a.m}月</span>`}).join('');
 let det='';
 if(cs){const l=lg.filter(x=>x.date==cs);det=`<div class=card><div class=row><h2 style="margin:0">${cs}</h2><span class=sp></span><button class=ghost onclick="rd=cs;go('rec')">去记录这天</button></div><div class=big>${fmt(sum(l))}</div>${SL.map(s=>{const q=l.filter(x=>x.slot==s[0]);return q.length?`<div class=row style="margin-top:8px"><span class=dot style="background:${s[2]}"></span>${s[1]}<span class=sp></span><span class=sub>${q.map(x=>item(x.item).name+' '+fmt(x.min)).join('，')}</span></div>`:''}).join('')||'<span class=sub>这天没有记录</span>'}</div>`}
 return `<div class=card><div class=row><button class=ghost onclick="co++;render()">‹</button><span class=sp style="text-align:center"><span class=sub>连续打卡 ${c} 天</span></span><button class=ghost onclick="co=Math.max(0,co-1);render()">›</button></div>
 <div class=chips style="margin:12px 0"><button class="tg ${!cf?'on':''}" style="--c:#C9C4D2" onclick="cf=0;render()"><i></i>全部</button>${S.items.filter(i=>!i.arch).map(i=>`<button class="tg ${cf==i.id?'on':''}" style="--c:${i.color}" onclick="cf=${i.id};render()"><i></i>${i.name}</button>`).join('')}</div>
 <div class=hm>${cells}</div><div class=hl>${lb}</div></div>${det}`;
}
/* ---------- 计划 ---------- */
function plan(){
 const t=dk(new Date()),act=S.items.filter(i=>!i.arch);
 const P=S.plans.map(p=>{const done=sum(S.logs.filter(l=>(!p.item||l.item==p.item)&&l.date>=p.start&&l.date<=p.end)),rem=Math.max(0,p.target-done),
  left=t>p.end?0:Math.round((pd(p.end)-pd(t<p.start?p.start:t))/864e5)+1,it=item(p.item);
  const msg=rem==0?'已完成':left==0?'已结束，还差 '+fmt(rem):`剩 ${left} 天，平均每天还需 ${fmt(Math.ceil(rem/left))}`;
  return `<div class=card data-k=plan data-id=${p.id}><div class=row><span class=dot style="background:${it.color}"></span><span class=nm>${p.name||it.name}</span><span class=sub>${p.start.slice(5)} ~ ${p.end.slice(5)}</span></div><div class=row style="margin:8px 0"><span class=v>${fmt(done)}</span><span class=sub>/ ${fmt(p.target)}</span></div><div class=bar><i style="width:${Math.min(100,done/p.target*100)}%;background:${it.color}"></i></div><div class=sub style="margin-top:8px">${msg}</div></div>`}).join('');
 const sh=sheet?`<div class=bd onclick="sheet=0;render()"></div><div class="sheet${sa?' up':''}">
  <div class=chips><button class="tg ${dr.item===0?'on':''}" style="--c:#C9C4D2" onclick="dr.item=0;render()"><i></i>全部</button>${act.map(i=>`<button class="tg ${dr.item==i.id?'on':''}" style="--c:${i.color}" onclick="dr.item=${i.id};render()"><i></i>${i.name}</button>`).join('')}<button class="pl sm" onclick="newItem(id=>{dr.item=id})">${PLUS}</button></div>
  <div class=chips>${[['month','本月'],['week','本周'],['custom','自定义']].map(m=>`<button class="tx ${dr.mode==m[0]?'on':''}" onclick="dr.mode='${m[0]}';render()">${m[1]}</button>`).join('')}</div>
  ${dr.mode=='custom'?`<div class=row style="margin-bottom:12px"><input type=date value="${dr.a}" onchange="dr.a=this.value" style="flex:1;font-size:14px"><span class=sub>至</span><input type=date value="${dr.b}" onchange="dr.b=this.value" style="flex:1;font-size:14px"></div>`:''}
  <div class=row><input type=number inputmode=decimal placeholder="目标小时数" value="${dr.h}" oninput="dr.h=this.value" style="flex:1"><button class=pl onclick="addPlan()">${PLUS}</button></div></div>`:'';
 return `${sheet?'':`<button class="pl fl" onclick="openSheet()">${PLUS}</button>`}${sh}${P?P+'<div class=sub style="padding:14px 0;font-size:12px">双击计划修改，长按删除</div>':'<div class=sub style="padding:18px 0">还没有计划，点右下角的 + 新建</div>'}`;
}
function openSheet(){const n=new Date(),act=S.items.filter(i=>!i.arch);dr={item:act[0]?act[0].id:0,h:'',mode:'month',a:dk(new Date(n.getFullYear(),n.getMonth(),1)),b:dk(new Date(n.getFullYear(),n.getMonth()+1,0))};sheet=1;sa=1;render();sa=0}
function addPlan(){const n=new Date();let a,b;
 if(dr.mode=='month'){a=dk(new Date(n.getFullYear(),n.getMonth(),1));b=dk(new Date(n.getFullYear(),n.getMonth()+1,0))}
 else if(dr.mode=='week'){const m=mon(n),e=new Date(m);e.setDate(e.getDate()+6);a=dk(m);b=dk(e)}
 else{a=dr.a;b=dr.b}
 const h=+dr.h;if(dr.item==null||!(h>0)||!a||!b||a>b)return;
 S.plans.push({id:S.nid++,item:dr.item,start:a,end:b,target:Math.round(h*60)});save();sheet=0;render()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='focus-backup-'+dk(new Date())+'.json';a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.items||!d.logs)throw 0;sure('导入会覆盖当前数据，继续吗？',()=>{S=d;S.plans=S.plans||[];S.goals=S.goals||{am:30,pm:30,ev:30};save();render()})}catch(e){note('文件格式不对，请选择导出的 .json 备份')}};r.readAsText(f)}
const PLUS='<svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
const CHECK='<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let dg=null;
function drawDg(){const e=$('#dg');if(!dg){e.hidden=true;e.innerHTML='';return}e.hidden=false;
 e.innerHTML=`<div class=bd onclick="dgx()"></div><div class="sheet up"><div style="margin-bottom:14px">${dg.t}</div>${dg.k=='i'?`<div class=row><input id=dgi type=${dg.num?'number':'text'} ${dg.num?'inputmode=decimal':''} value="${dg.v}" style="flex:1" onkeydown="if(event.key=='Enter')dgok()"><button class=pl onclick="dgok()">${CHECK}</button></div>`:`<div class=row style="justify-content:flex-end;gap:24px">${dg.k=='c'?'<button class="ghost lk" style="color:var(--sub)" onclick="dgx()">取消</button>':''}<button class="ghost lk" onclick="dgok()">确定</button></div>`}</div>`;
 if(dg.k=='i')setTimeout(()=>{const i=$('#dgi');i&&i.focus()},60)}
const ask=(t,v,cb,num)=>{dg={k:'i',t,v:String(v==null?'':v).replace(/"/g,'&quot;'),cb,num};drawDg()};
const sure=(t,cb)=>{dg={k:'c',t,cb};drawDg()};
const note=t=>{dg={k:'m',t,cb:()=>{}};drawDg()};
function dgx(){dg=null;drawDg()}
function dgok(){const d=dg,v=d.k=='i'?$('#dgi').value:1;dg=null;drawDg();d.cb(v)}
const HD={
 log:{dt:id=>{const l=S.logs.find(x=>x.id==id);l&&ask('修改时长（分钟）',l.min,v=>{v=Math.round(+v);if(v>0){l.min=v;save();render()}},1)},lp:id=>sure('删除这条记录？',()=>{S.logs=S.logs.filter(l=>l.id!=id);save();render()})},
 item:{dt:id=>{const i=item(id);ask('专注项名称',i.name,v=>{v=v.trim();if(v){i.name=v;save();render()}})},lp:id=>sure(`删除「${item(id).name}」？它的记录和计划也会一起删除`,()=>{S.items=S.items.filter(i=>i.id!=id);S.logs=S.logs.filter(l=>l.item!=id);S.plans=S.plans.filter(p=>p.item!=id);save();render()})},
 plan:{dt:id=>{const p=S.plans.find(x=>x.id==id);p&&ask('计划名称',p.name||item(p.item).name,n=>{p.name=n.trim()||undefined;ask('目标小时数',+(p.target/60).toFixed(2),h=>{h=+h;if(h>0)p.target=Math.round(h*60);save();render()},1)})},lp:id=>sure('删除这个计划？',()=>{S.plans=S.plans.filter(p=>p.id!=id);save();render()})}
};
let gt=null,gf=0,gk='',gl=0,gx=0,gy=0;
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-k]');if(!el)return;gf=0;gx=e.clientX;gy=e.clientY;clearTimeout(gt);gt=setTimeout(()=>{gf=1;HD[el.dataset.k].lp(+el.dataset.id)},600)});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>clearTimeout(gt)));
document.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-gx)+Math.abs(e.clientY-gy)>12)clearTimeout(gt)});
document.addEventListener('click',e=>{const el=e.target.closest('[data-k]');if(!el)return;if(gf){gf=0;return}const k=el.dataset.k+el.dataset.id,n=Date.now();if(k==gk&&n-gl<350){gk='';HD[el.dataset.k].dt(+el.dataset.id)}else{gk=k;gl=n}});
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-k]'))e.preventDefault()});
function goal(s){ask('每天的目标（分钟）',S.goals[s],v=>{v=+v;if(v>0){S.goals[s]=v;save();render()}},1)}
function newItem(f){ask('专注项名称','',n=>{n=n.trim();if(!n)return;const id=S.nid++;S.items.push({id,name:n,color:PAL.find(c=>!S.items.some(i=>i.color==c))||PAL[S.items.length%PAL.length]});save();if(f)f(id);render()})}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
render();
</script></body></html>
