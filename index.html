<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F2EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="专注">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>专注记录</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F2EA;--card:#FFFDF9;--tx:#4A4458;--sub:#9A93A6;--ac:#8E9AC8;--soft:#F1EBE1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Nunito",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;padding-top:env(safe-area-inset-top)}
#main{padding:16px 16px 110px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px rgba(120,100,140,.07)}
h2{font-size:15px;margin:0 0 10px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:0;border-radius:999px;padding:8px 14px;background:var(--soft);color:var(--tx);font:inherit;font-size:14px}
.chip.on{background:var(--c,var(--ac));color:#fff}
input,select{font:inherit;border:0;background:var(--soft);border-radius:12px;padding:10px 12px;color:var(--tx);min-width:0}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:14px;padding:10px 18px;background:var(--ac);color:#fff;font-weight:800}
.ghost{border:0;background:none;color:var(--sub);font-size:13px;padding:4px}
.bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;border-radius:8px}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.sub{color:var(--sub);font-size:13px}.big{font-size:26px;font-weight:800;margin:6px 0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(255,253,249,.92);backdrop-filter:blur(10px);padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(120,100,140,.08)}
nav button{flex:1;border:0;background:none;padding:6px;color:var(--sub);font-size:12px;font-weight:700}
nav button.on{color:var(--ac)}nav b{display:block;font-size:20px;margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{aspect-ratio:1;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:12px;border:0;color:var(--tx);padding:0}
.hd{text-align:center;font-size:11px;color:var(--sub)}
</style></head><body><div id="main"></div><nav></nav>
<script>
const $=s=>document.querySelector(s);
const SL=[['am','上午','#E8B4A0'],['pm','下午','#E2C275'],['ev','晚上','#8E9AC8']];
const PAL=['#8E9AC8','#E8A598','#E2C275','#9DB4A0','#B7A3C9','#8FB8C9','#D9A3B0','#A7B57A'];
let S=JSON.parse(localStorage.getItem('focus')||'null')||{items:[{id:1,name:'画画',color:PAL[1]},{id:2,name:'运动',color:PAL[3]}],logs:[],plans:[],goals:{am:30,pm:30,ev:30},nid:3};
const save=()=>localStorage.setItem('focus',JSON.stringify(S));
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-');return new Date(a,b-1,c)};
const fmt=m=>{const h=Math.floor(m/60),r=m%60;return h==0?r+'分钟':r==0?h+'小时':h+'小时'+r+'分钟'};
const sh=m=>m<60?m+'m':+(m/60).toFixed(1)+'h';
const item=id=>S.items.find(i=>i.id==id)||{name:'已删除',color:'#ccc'};
const sum=a=>a.reduce((x,l)=>x+l.min,0);
const hexA=(h,a)=>`rgba(${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)},${a})`;
const mon=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const curSlot=()=>{const h=new Date().getHours();return h<12?'am':h<18?'pm':'ev'};
let tab='rec',rd=dk(new Date()),rs=curSlot(),ri=0,sv='day',cm=new Date(),cf=0,cs=null;cm.setDate(1);
const NAV=[['cal','📅','日历'],['rec','✏️','记录'],['stat','📊','统计'],['plan','🎯','计划']];
function go(t){tab=t;render()}
function render(){
 $('nav').innerHTML=NAV.map(n=>`<button class="${n[0]==tab?'on':''}" onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join('');
 $('#main').innerHTML={cal,rec,stat,plan}[tab]();
}
/* ---------- 记录 ---------- */
function rec(){
 const act=S.items.filter(i=>!i.arch);
 if(!act.some(i=>i.id==ri))ri=act[0]?act[0].id:0;
 const L=S.logs.filter(l=>l.date==rd);
 return `<div class=card><div class=row><input type=date value="${rd}" onchange="rd=this.value||rd;render()"><span class=sp></span><button class=ghost onclick="rd=dk(new Date());render()">回到今天</button></div></div>
 <div class=card><h2>记一笔</h2>
 <div class=chips>${SL.map(s=>`<button class="chip ${rs==s[0]?'on':''}" style="--c:${s[2]}" onclick="rs='${s[0]}';render()">${s[1]}</button>`).join('')}</div>
 <div class=chips>${act.map(i=>`<button class="chip ${ri==i.id?'on':''}" style="--c:${i.color}" onclick="ri=${i.id};render()">${i.name}</button>`).join('')||'<span class=sub>先在下方新增一个专注项</span>'}</div>
 <div class=chips>${[10,20,30].map(m=>`<button class=chip onclick="add(${m})">+${m}分钟</button>`).join('')}</div>
 <div class=row><input id=mi type=number inputmode=numeric min=1 placeholder="自己填分钟数" style="flex:1"><button class=btn onclick="add(+$('#mi').value)">添加</button></div></div>
 ${SL.map(s=>{const l=L.filter(x=>x.slot==s[0]),t=sum(l),g=S.goals[s[0]];return `<div class=card><div class=row><h2 style="margin:0">${s[1]}</h2><span class=sp></span><button class=ghost onclick="goal('${s[0]}')">目标 ${fmt(g)} ✎</button></div><div class=big>${fmt(t)}</div><div class=bar><i style="width:${Math.min(100,t/g*100)}%;background:${s[2]}"></i></div>${l.map(x=>`<div class=row style="margin-top:10px"><span class=dot style="background:${item(x.item).color}"></span>${item(x.item).name}<span class=sp></span><span class=sub>${fmt(x.min)}</span><button class=ghost onclick="del(${x.id})">✕</button></div>`).join('')}</div>`}).join('')}
 <div class=card><div class=row><h2 style="margin:0">专注项</h2><span class=sp></span><button class=ghost onclick="newItem()">＋ 新增</button></div>${S.items.map(i=>`<div class=row style="margin-top:10px;opacity:${i.arch?0.5:1}"><span class=dot style="background:${i.color};width:18px;height:18px" onclick="recolor(${i.id})"></span>${i.name}<span class=sp></span><button class=ghost onclick="arch(${i.id})">${i.arch?'恢复':'归档'}</button></div>`).join('')}<div class=sub style="margin-top:10px">点圆点可换颜色；归档后历史数据仍保留</div></div>`;
}
function add(m){if(!m||m<=0||!ri)return;S.logs.push({id:S.nid++,date:rd,slot:rs,item:ri,min:Math.round(m)});save();render()}
function del(id){S.logs=S.logs.filter(l=>l.id!=id);save();render()}
function goal(s){const v=+prompt('每天该时段的目标（分钟）',S.goals[s]);if(v>0){S.goals[s]=v;save();render()}}
function newItem(){const n=prompt('专注项名称');if(n&&n.trim()){S.items.push({id:S.nid++,name:n.trim(),color:PAL[S.items.length%PAL.length]});save();render()}}
function recolor(id){const i=item(id),k=PAL.indexOf(i.color);i.color=PAL[(k+1)%PAL.length];save();render()}
function arch(id){const i=item(id);i.arch=!i.arch;save();render()}
/* ---------- 统计 ---------- */
function buckets(m){const n=new Date(),a=[],f=d=>(d.getMonth()+1)+'/'+d.getDate();
 if(m=='day')for(let i=13;i>=0;i--){const d=new Date(n);d.setDate(d.getDate()-i);a.push({k:dk(d),l:f(d)})}
 else if(m=='week')for(let i=7;i>=0;i--){const d=mon(n);d.setDate(d.getDate()-i*7);a.push({k:dk(d),l:f(d)})}
 else for(let i=m=='month'?11:5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);a.push({k:d.getFullYear()+'-'+pad(d.getMonth()+1),l:(d.getMonth()+1)+'月'})}
 return a}
function stat(){
 const m=sv,slot=m=='slot',bs=buckets(m);
 const key=l=>m=='day'?l.date:m=='week'?dk(mon(pd(l.date))):l.date.slice(0,7);
 const seg=slot?SL.map(s=>({id:s[0],n:s[1],c:s[2]})):S.items.map(i=>({id:i.id,n:i.name,c:i.color}));
 const sid=l=>slot?l.slot:l.item;
 const G=bs.map(b=>({l:b.l,s:seg.map(g=>sum(S.logs.filter(l=>key(l)==b.k&&sid(l)==g.id)))}));
 const tot=seg.map((g,i)=>({...g,v:G.reduce((a,b)=>a+b.s[i],0)})),all=tot.reduce((a,x)=>a+x.v,0);
 const n=G.length,W=340,H=150,bw=W/n,mx=Math.max(1,...G.map(b=>b.s.reduce((a,x)=>a+x,0)));
 let svg=`<svg viewBox="0 0 ${W} ${H+24}" width="100%">`;
 G.forEach((b,i)=>{let y=H;const x=i*bw+bw*.2,w=bw*.6,t=b.s.reduce((a,v)=>a+v,0);
  b.s.forEach((v,j)=>{if(!v)return;const h=v/mx*(H-16);y-=h;svg+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${seg[j].c}"/>`});
  if(t)svg+=`<text x="${x+w/2}" y="${y-4}" font-size="8" text-anchor="middle" fill="#9A93A6">${sh(t)}</text>`;
  svg+=`<text x="${x+w/2}" y="${H+14}" font-size="8" text-anchor="middle" fill="#9A93A6">${b.l}</text>`});
 svg+='</svg>';
 const T=[['day','按天'],['week','按周'],['month','按月'],['slot','按时段']];
 return `<div class=chips>${T.map(t=>`<button class="chip ${sv==t[0]?'on':''}" onclick="sv='${t[0]}';render()">${t[1]}</button>`).join('')}</div>
 <div class=card><div class=sub>${{day:'最近 14 天',week:'最近 8 周',month:'最近 12 个月',slot:'最近 6 个月 · 上午/下午/晚上'}[m]}合计</div><div class=big>${fmt(all)}</div>${svg}</div>
 <div class=card><h2>构成</h2>${tot.filter(t=>t.v).map(t=>`<div class=row style="margin-bottom:10px"><span class=dot style="background:${t.c}"></span>${t.n}<span class=sp></span><span class=sub>${fmt(t.v)}${slot?' · '+Math.round(t.v/all*100)+'%':''}</span></div>`).join('')||'<span class=sub>还没有记录，去「记录」页记一笔吧</span>'}</div>`;
}
/* ---------- 日历 ---------- */
function cal(){
 const y=cm.getFullYear(),mo=cm.getMonth(),off=(new Date(y,mo,1).getDay()+6)%7,nd=new Date(y,mo+1,0).getDate();
 const lg=S.logs.filter(l=>!cf||l.item==cf),by={};
 lg.forEach(l=>{const o=by[l.date]=by[l.date]||{};o[l.item]=(o[l.item]||0)+l.min});
 const days=new Set(S.logs.map(l=>l.date));let c=0,d=new Date();if(!days.has(dk(d)))d.setDate(d.getDate()-1);
 while(days.has(dk(d))){c++;d.setDate(d.getDate()-1)}
 let cells='',mt=0,md=0;
 for(let i=0;i<off;i++)cells+='<div></div>';
 for(let i=1;i<=nd;i++){const k=y+'-'+pad(mo+1)+'-'+pad(i),o=by[k];let st='';
  if(o){const e=Object.entries(o),t=e.reduce((a,x)=>a+x[1],0),dom=e.sort((a,b)=>b[1]-a[1])[0][0];mt+=t;md++;st=`background:${hexA(item(dom).color,.3+.7*Math.min(t/120,1))};`}
  if(k==dk(new Date()))st+='box-shadow:inset 0 0 0 2px #8E9AC8;';
  if(k==cs)st+='box-shadow:inset 0 0 0 2px #4A4458;';
  cells+=`<button class=cell style="${st}" onclick="cs='${k}';render()">${i}</button>`}
 let det='';
 if(cs){const l=lg.filter(x=>x.date==cs);det=`<div class=card><div class=row><h2 style="margin:0">${cs}</h2><span class=sp></span><button class=ghost onclick="rd=cs;go('rec')">去记录这天</button></div><div class=big>${fmt(sum(l))}</div>${SL.map(s=>{const q=l.filter(x=>x.slot==s[0]);return q.length?`<div class=row style="margin-top:8px"><span class=dot style="background:${s[2]}"></span>${s[1]}<span class=sp></span><span class=sub>${q.map(x=>item(x.item).name+' '+fmt(x.min)).join('，')}</span></div>`:''}).join('')||'<span class=sub>这天没有记录</span>'}</div>`}
 return `<div class=card><div class=row><button class=ghost onclick="cm.setMonth(cm.getMonth()-1);render()">‹</button><span class=sp style="text-align:center;font-weight:800">${y}年${mo+1}月</span><button class=ghost onclick="cm.setMonth(cm.getMonth()+1);render()">›</button></div>
 <div class=sub style="text-align:center;margin:6px 0 12px">连续打卡 ${c} 天 · 本月 ${md} 天 · ${fmt(mt)}</div>
 <div class=chips><button class="chip ${!cf?'on':''}" onclick="cf=0;render()">全部</button>${S.items.filter(i=>!i.arch).map(i=>`<button class="chip ${cf==i.id?'on':''}" style="--c:${i.color}" onclick="cf=${i.id};render()">${i.name}</button>`).join('')}</div>
 <div class=grid>${'一二三四五六日'.split('').map(x=>`<div class=hd>${x}</div>`).join('')}${cells}</div>
 <div class=sub style="margin-top:12px">颜色 = 当天最多的专注项，越深越久</div></div>${det}`;
}
/* ---------- 计划 ---------- */
function plan(){
 const n=new Date(),a=dk(new Date(n.getFullYear(),n.getMonth(),1)),b=dk(new Date(n.getFullYear(),n.getMonth()+1,0)),t=dk(n);
 const act=S.items.filter(i=>!i.arch);
 const P=S.plans.map(p=>{const done=sum(S.logs.filter(l=>l.item==p.item&&l.date>=p.start&&l.date<=p.end)),rem=Math.max(0,p.target-done),
  left=t>p.end?0:Math.round((pd(p.end)-pd(t<p.start?p.start:t))/864e5)+1,it=item(p.item);
  const msg=rem==0?'已完成 🎉':left==0?'已结束，还差 '+fmt(rem):`剩 ${left} 天 · 平均每天还需 ${fmt(Math.ceil(rem/left))}`;
  return `<div class=card><div class=row><span class=dot style="background:${it.color}"></span><b>${it.name}</b><span class=sub>${p.start.slice(5)} ~ ${p.end.slice(5)}</span><span class=sp></span><button class=ghost onclick="S.plans=S.plans.filter(x=>x.id!=${p.id});save();render()">删除</button></div><div class=big>${fmt(done)} <span class=sub>/ ${fmt(p.target)}</span></div><div class=bar><i style="width:${Math.min(100,done/p.target*100)}%;background:${it.color}"></i></div><div class=sub style="margin-top:8px">${msg}</div></div>`}).join('');
 return `${P||'<div class=card><span class=sub>还没有计划，比如「本月画画 20 小时」</span></div>'}
 <div class=card><h2>新建计划</h2><div class=row style="margin-bottom:10px"><select id=pi style="flex:1">${act.map(i=>`<option value=${i.id}>${i.name}</option>`).join('')}</select><input id=ph type=number inputmode=decimal placeholder="目标小时" style="width:110px"></div>
 <div class=row style="margin-bottom:12px"><input id=pa type=date value="${a}" style="flex:1"><span class=sub>至</span><input id=pb type=date value="${b}" style="flex:1"></div><button class=btn onclick="addPlan()">添加计划</button></div>
 <div class=card><h2>数据备份</h2><div class=sub style="margin-bottom:10px">数据只存在这台设备的浏览器里，建议定期导出</div><div class=row><button class=btn onclick="exp()">导出备份</button><button class=btn style="background:#B7A3C9" onclick="$('#fi').click()">导入备份</button></div><input id=fi type=file accept=".json" hidden onchange="imp(this.files[0])"></div>`;
}
function addPlan(){const it=+$('#pi').value,h=+$('#ph').value,a=$('#pa').value,b=$('#pb').value;if(!it||!(h>0)||!a||!b)return;S.plans.push({id:S.nid++,item:it,start:a,end:b,target:Math.round(h*60)});save();render()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='focus-backup-'+dk(new Date())+'.json';a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.items||!d.logs)throw 0;if(confirm('导入会覆盖当前数据，继续吗？')){S=d;S.plans=S.plans||[];S.goals=S.goals||{am:30,pm:30,ev:30};save();render()}}catch(e){alert('文件格式不对，请选择导出的 .json 备份')}};r.readAsText(f)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
render();
</script></body></html>
